name: Update Free VPN Configs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: proxy-config
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout proxy-config branch
        uses: actions/checkout@v4
        with:
          ref: proxy-config
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache xray binary
        uses: actions/cache@v4
        with:
          path: /tmp/xray-validator-bin
          key: xray-core-linux-64

      - name: Run scraper (active servers only)
        run: python scraper.py

      - name: Commit and push to proxy-config
        run: |
          set -euo pipefail
          git config user.name  "Josephdinye"
          git config user.email "201128931+Josephdinye@users.noreply.github.com"

          git add configs.txt

          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi

          git commit -m "chore: update active free VPN configs [skip ci]"
          git pull --rebase origin proxy-config || true
          git push origin HEAD:proxy-config
