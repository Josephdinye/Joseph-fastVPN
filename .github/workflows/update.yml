name: Update Free VPN Configs
on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" to test it anytime
permissions:
  contents: write # Grants GitHub permission to push the generated configs.txt back to your repo
jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 35 # scraper.py self-limits its validation pass to 28 minutes and always writes configs.txt before exiting; this is just a safety margin on top of that
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Run Proxy Scraper And Validator Script
      run: python scraper.py
    - name: Commit and Push Updated Configurations
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add configs.txt
        if git diff --staged --quiet; then
          echo "No new configuration links detected. Skipping commit."
        else
          git commit -m "Automated update: Refreshed free proxy configs (online only)"
          git push
        fi
